name: Retire historical MIT release tag (one-time)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  retire:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the verified MIT-era tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: "v1.1.0"
          EXPECTED_TAG_OBJECT: "223b6867a7a8b74f5e11b62a509f7b992a6a8b79"
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$SHA" ]]; then
            echo "Main changed after successful CI; aborting cleanup"
            exit 1
          fi
          gh api "repos/$REPO/contents/LICENSE?ref=main" --jq '.content' | base64 -d | grep -qi "All rights reserved"
          tag_obj="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$tag_obj" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Tag changed since review; aborting cleanup"
            exit 1
          fi
          current_release_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id')"
          if [[ "$current_release_id" != "422391208" ]]; then
            echo "Release changed since inspection; do not delete"
            exit 1
          fi
          gh api -X DELETE "repos/$REPO/releases/$current_release_id"
          echo "Historic GitHub Release listing deleted"
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag still present after delete"
            exit 1
          fi
          echo "MIT-era tag retired; full Git history and existing copyright grants remain unchanged."
